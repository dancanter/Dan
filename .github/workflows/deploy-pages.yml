name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/coding-capabilities-21nmif]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # GitHub Pages has no server-side routing, so unknown paths (e.g. a
      # direct link to /article/some-id) 404 unless index.html is also
      # served as the 404 page — the client-side router then takes over.
      - run: cp dist/index.html dist/404.html
      # The training tracker is a standalone single-file app, not part of the
      # Vite build. Serving it from a real origin is what lets it save: it
      # keeps its data in localStorage, which needs a stable origin to survive.
      - run: mkdir -p dist/training-system && cp training-system/index.html dist/training-system/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
