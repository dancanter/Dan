name: Glow CI

on:
  push:
    paths: ['glow/**', '.github/workflows/glow-ci.yml']
  pull_request:
    paths: ['glow/**', '.github/workflows/glow-ci.yml']

defaults:
  run:
    working-directory: glow

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glow/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
