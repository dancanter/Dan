name: The Good Life CI

on:
  push:
    paths: ['good-life/**', '.github/workflows/good-life-ci.yml']
  pull_request:
    paths: ['good-life/**', '.github/workflows/good-life-ci.yml']

defaults:
  run:
    working-directory: good-life

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: good-life/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
