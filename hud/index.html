<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d11">
<meta name="robots" content="noindex">
<title>Apex HUD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column of hairline panels on matte ink; a single sea-blue accent, gold only for rank, colour reserved for state. */
:root{
  color-scheme:dark;
  --bg:#0a0d11; --panel:#10141a; --panel2:#161b23; --line:#1e2530; --line2:#2b3442;
  --fg:#ece8df; --mut:#8d96a4; --dim:#5f6876;
  --acc:#7cc4d6; --gold:#cfab66; --violet:#a99de6;
  --ok:#62c690; --warn:#e3aa4f; --bad:#e8706f;
  --f-d:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-b);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-block:14px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .dim{color:var(--dim)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .acc{color:var(--acc)} .gold{color:var(--gold)}
.small{font-size:12px} .tiny{font-size:11px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font:400 26px/1 var(--f-d);letter-spacing:.01em}
.brand i{color:var(--acc);font-style:italic}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mut);background:transparent;white-space:nowrap}
.chip b{color:var(--fg);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.g{background:var(--ok)} .dot.a{background:var(--warn)} .dot.r{background:var(--bad)}

.sync{display:flex;gap:8px;margin-bottom:12px}
.sync input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12px var(--f-m)}
.sync input::placeholder{color:var(--dim)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 2px;color:var(--mut);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}

/* panels */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.sp{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel.flat{background:transparent}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:500}
.big{font:400 40px/1 var(--f-d)}
.mid{font:400 26px/1.05 var(--f-d)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:last-child{text-align:right}

.mission{border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px;background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;gap:14px;align-items:flex-start}
.mission h2{font:400 22px/1.2 var(--f-d);text-wrap:balance}
.mission p{color:var(--mut);margin-top:4px;max-width:65ch}
.state{border-left:3px solid var(--dim);padding:2px 0 2px 12px}
.state.g{border-color:var(--ok)} .state.a{border-color:var(--warn)} .state.r{border-color:var(--bad)}
.alert{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert.a{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 7%,transparent)}
.alert.r{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));background:color-mix(in srgb,var(--bad) 8%,transparent)}
.alert.g{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 6%,transparent)}
.alert .dot{margin-top:6px}

.tile{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.tile .v{font:500 18px/1.2 var(--f-m);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:11px;color:var(--mut);margin-top:2px}

.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#06222a}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));color:var(--bad)}
.x{background:none;border:0;color:var(--dim);padding:2px 6px;font-size:14px}
.x:hover{color:var(--bad)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;color:var(--mut);letter-spacing:.04em}
.in{background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;width:100%;min-width:0;font-family:var(--f-m);font-size:13px}
textarea.in{font-family:var(--f-b);resize:vertical;min-height:72px}
select.in{font-family:var(--f-b)}

details.drawer{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.drawer>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:500}
details.drawer>summary::-webkit-details-marker{display:none}
details.drawer>summary::after{content:"+";margin-left:auto;color:var(--mut);font:400 18px var(--f-m)}
details.drawer[open]>summary::after{content:"–"}
details.drawer>summary .hint{color:var(--mut);font-weight:400;font-size:12px}
details.drawer>.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}

.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{appearance:none;width:18px;height:18px;border:1.5px solid var(--line2);border-radius:6px;flex:none;margin:1px 0 0;display:grid;place-items:center;background:var(--bg)}
.check input:checked{background:var(--acc);border-color:var(--acc)}
.check input:checked::after{content:"";width:9px;height:5px;border:2px solid #06222a;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.check .t{font-size:13px}
.check .d{font-size:12px;color:var(--mut)}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--acc);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar.thick{height:12px}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
.boss{padding:12px 0;border-bottom:1px solid var(--line)}
.boss:last-child{border-bottom:0}
.boss .bar>i{background:linear-gradient(90deg,var(--bad),var(--warn) 55%,var(--ok))}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-weight:500;color:var(--mut);text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.tall{max-height:380px;overflow:auto}

svg text{font-family:var(--f-m);font-size:10px;fill:var(--mut)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:2px;margin-right:5px;vertical-align:middle;background:var(--acc)}

.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.pill.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pill.a{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.pill.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.pill.b{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.pill.au{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}

.clock{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.clock .big{font-size:clamp(34px,8vw,56px)}
.clock .vs{color:var(--dim);font:italic 18px var(--f-d);padding-bottom:8px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.trophy{border:1px solid var(--line);border-radius:10px;padding:10px;opacity:.45}
.trophy.on{opacity:1;border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.trophy b{display:block;font-weight:500;font-size:13px}
.trophy.on b{color:var(--gold)}
.res{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.res:hover{background:var(--panel2)}
.res .nm{flex:1;min-width:0}
.res .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--f-m);border:2px solid var(--line2);flex:none}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,6,9,.78);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font:400 24px/1.15 var(--f-d)}
.tcount{font:400 clamp(54px,16vw,84px)/1 var(--f-m);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.02em}
.orb{width:150px;height:150px;border-radius:50%;margin:6px auto;border:1px solid var(--acc);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 70%);transform:scale(.6);transition:transform 2s ease-in-out}
.cue{text-align:center;font:400 22px/1.3 var(--f-d);min-height:58px;text-wrap:balance}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;font-size:13px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.bar>i,.orb{transition:none}}
.prose{max-width:68ch;color:var(--fg)} .prose p{margin:0 0 8px;color:var(--mut)} .prose b{color:var(--fg);font-weight:500}
.prose h3{font:400 19px/1.25 var(--f-d);margin:12px 0 6px}
.prose ul{margin:0 0 8px;padding-left:18px;color:var(--mut)} .prose li{margin-bottom:5px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Apex <i>HUD</i></div>
    <span class="chip" id="chipPhase"></span>
    <span class="sp"></span>
    <span class="chip" id="chipRank"></span>
    <button class="btn sm ghost" data-act="openSettings">Settings &amp; data</button>
  </header>
  <form class="sync" id="syncForm" autocomplete="off">
    <input id="syncIn" aria-label="Smart paste sync line" placeholder="SYNC: WT=150.2 | RHR=52 | SLEEP=8 | STEPS=10000 | CALS=2000 | STUDY=3 | STRESS=3 | SODIUM=low">
    <button class="btn pri" type="submit">Sync</button>
  </form>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

function parseSync(str) {
  const parts = str.replace(/^\s*SYNC\s*:?/i, '').split('|').map(s => s.trim()).filter(Boolean), out = { f: {}, n: 0 };
  const ORDER = ['WT', 'RHR', 'HRV', 'SLEEP', 'DEEP', 'REM', 'STEPS', 'CALS', 'STUDY', 'CELLULAR', 'STRESS', 'SODIUM'];
  const MAP = { WT: 'wt', WEIGHT: 'wt', RHR: 'rhr', HRV: 'hrv', SLEEP: 'sleep', DEEP: 'deep', REM: 'rem', STEPS: 'steps', CALS: 'cals', KCAL: 'cals', CALORIES: 'cals', STUDY: 'study', CELLULAR: 'cellular', STRESS: 'stress', SORE: 'sore', SORENESS: 'sore', URGE: 'urge', LIGHT: 'light', MOOD: 'mood', PUFF: 'puff' };
  const keyed = parts.some(p => /^[A-Za-z_ ]+\s*[=:]/.test(p) && !/^\d{1,2}:\d{2}/.test(p));
  let pos = 0;
  parts.forEach(p => {
    let k, v; const m = p.match(/^([A-Za-z_ ]+?)\s*[=:]\s*(.*)$/);
    if (keyed) { if (!m) return; k = m[1].toUpperCase().trim(); v = m[2].trim(); }
    else { if (/^\d{4}-\d{2}-\d{2}$/.test(p)) { k = 'DATE'; v = p; } else { k = ORDER[pos++]; v = p; } }
    v = v.replace(/^\[|\]$/g, '').trim(); if (!v || /^(—|–|-|n\/?a|none|null)$/i.test(v)) return;
    if (k === 'DATE') { if (/^\d{4}-\d{2}-\d{2}$/.test(v)) out.date = v; return; }
    if (k === 'SODIUM') { const s = v.toLowerCase(); out.f.sodium = /^l/.test(s) ? 'low' : /^m/.test(s) ? 'med' : /^h/.test(s) ? 'high' : (num(s) != null ? (num(s) <= 1700 ? 'low' : num(s) <= 2200 ? 'med' : 'high') : undefined); if (out.f.sodium) out.n++; return; }
    if (k === 'BED' || k === 'WAKE') { if (/^\d{1,2}:\d{2}$/.test(v)) { out.f[k.toLowerCase()] = v.padStart(5, '0'); out.n++; } return; }
    if (k === 'RUN') { const km = v.match(/([\d.]+)\s*k/i), tm = v.match(/(\d+:\d{2}(?::\d{2})?)/), ty = v.match(/\b(easy|hard|speed|sub|tt|steady)\b/i); if (km && tm) { out.run = { km: +km[1], sec: parseT(tm[1]), type: ty ? ty[1].toLowerCase() : 'easy', name: v }; out.n++; } return; }
    if (k === 'LIFT' || k === 'GYM') { const n = v.match(/(\d+)\s*(sets)?\s*$/i), fo = v.replace(/(\d+)\s*(sets)?\s*$/i, '').trim() || 'gym'; out.lift = { focus: fo, sets: { [fo.toLowerCase()]: n ? +n[1] : 0 } }; out.n++; return; }
    const key = MAP[k]; if (!key) return; const n = num(v.replace(/,/g, '').replace(/[^\d.\-]/g, '')); if (n == null) return;
    out.f[key] = n; out.n++;
  });
  return out;
}

let toastT; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }
function importData(text) {
  try { const j = JSON.parse(text); if (!j || typeof j !== 'object' || (!j.days && !j.settings && !j.profile)) throw 0; const ui = S.ui; S = merge(DEF(), j); S.ui = { ...ui, ...(j.ui || {}) }; delete S.fresh; save(); closeModal(); render(); toast('Data loaded.'); }
  catch (e) { toast('That is not a valid data file. It should start with { and include days or settings.'); }
}
function copyText(text, okMsg) { const done = () => toast(okMsg); try { navigator.clipboard.writeText(text).then(done, () => { textSheet('Copy this', text, 'Select all and copy.'); }); } catch (e) { textSheet('Copy this', text, 'Select all and copy.'); } }
const backup = () => { const c = JSON.parse(JSON.stringify(S)); delete c.fresh; return JSON.stringify(c); };
function confirmStep(el, fn) { if (el.dataset.step === '1') { el.dataset.step = '2'; el.textContent = 'Tap again to confirm'; setTimeout(() => { if (el.isConnected) { el.dataset.step = '1'; } }, 4000); } else fn(); }

const ACT = {
  tab: el => { S.ui.tab = el.dataset.tab; save(); render(); window.scrollTo(0, 0); },
  backdrop: (el, e) => { if (e.target === el) closeModal(); },
  close: closeModal,
  openSettings: settingsSheet,
  focusLog: () => { S.ui.open.log = true; render(); $('#f_wt')?.focus(); $('#f_wt')?.scrollIntoView({ block: 'center' }); },
  logDate: el => { const n = +el.dataset.n; S.ui.logDate = n === 0 ? today() : dAdd(S.ui.logDate || today(), n); if (S.ui.logDate > today()) S.ui.logDate = today(); render(); },
  flag: el => { const x = D(el.dataset.date); x[el.dataset.k] = !x[el.dataset.k]; save(); render(); },
  timer: el => openTimer(el.dataset.type),
  tStart: el => { if (!T) return; if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* silent */ } } try { navigator.wakeLock?.request('screen').catch(() => { }); } catch (e) { /* optional */ } if (T.running) { T.running = false; T.left = Math.max(0, (T.end - Date.now()) / 1000); clearInterval(T.iv); el.textContent = 'Resume'; } else { T.running = true; T.end = Date.now() + T.left * 1000; T.iv = setInterval(tick, 250); el.textContent = 'Pause'; tick(); } },
  tEnd: () => { if (!T) return; const left = T.running ? Math.max(0, (T.end - Date.now()) / 1000) : T.left, min = (T.total - left) / 60; if (min < 5) { toast('Under 5 minutes: nothing logged.'); closeModal(); return; } finishTimer(min); },
  report: () => textSheet('Sunday boardroom report', report(), 'Paste this to your coach for the weekly grade and next week’s three missions.'),
  copyOut: () => { const t = $('#outText'); t.select(); copyText(t.value, 'Copied.'); },
  copyBackup: () => copyText(backup(), 'Backup copied. Paste it somewhere safe.'),
  dlBackup: () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([backup()], { type: 'application/json' })); a.download = `apex-hud-${today()}.json`; a.click(); toast('If no file appeared, this viewer blocks downloads: use Copy backup.'); } catch (e) { toast('Downloads are blocked here. Use Copy backup.'); } },
  importText: () => importData($('#impText').value),
  startBlank: () => { delete S.fresh; D(today()); S.days[today()].note = ''; save(); S.ui.open.log = true; settingsSheet(); render(); },
  resetSeed: el => confirmStep(el, () => { const s = readSeed(); S = merge(DEF(), s); save(); closeModal(); render(); toast('Back to the starting data.'); }),
  wipe: el => confirmStep(el, () => { try { localStorage.removeItem(KEY); } catch (e) { /* nothing stored */ } S = DEF(); S.fresh = true; closeModal(); render(); }),
  saveSettings: () => { const c = cfg(), g = id => num($('#' + id).value); S.profile.dob = $('#s_dob').value; S.profile.heightCm = g('s_h') || S.profile.heightCm; S.profile.coeliac = $('#s_coe').value === '1';
    [['kcal', 's_kcal'], ['satKcal', 's_sat'], ['maintenance', 's_maint'], ['protein', 's_pro'], ['fat', 's_fat'], ['floor', 's_floor'], ['naCap', 's_na'], ['kTarget', 's_k'], ['refeedKcal', 's_ref'], ['stepsLo', 's_slo'], ['stepsWeek', 's_swk'], ['studyTarget', 's_study']].forEach(([k, id]) => { const v = g(id); if (v != null || ['satKcal', 'maintenance', 'floor'].includes(k)) c[k] = v; });
    if (c.fat < 45) { c.fat = 45; toast('Fat held at the 45 g floor.'); }
    c.bedBy = $('#s_bed').value || c.bedBy; c.lastDeload = $('#s_dl').value || null; c.excluded = $('#s_ex').value.split(',').map(s => s.trim()).filter(Boolean); save(); closeModal(); render(); toast('Settings saved.'); },
  refeedToday: () => { D(today()).refeed = true; save(); render(); toast(`Refeed day: ${cfg().refeedKcal.toLocaleString()} kcal. Extra carbs from rice, potatoes, oats and fruit. Salt as usual.`); },
  refeedOff: () => { D(today()).refeed = false; save(); render(); },
  startReverse: () => { const c = cfg(); c.reverseFrom = target().mode === 'cut' ? target().kcal : c.kcal; c.phase = 'reverse'; c.reverseStart = today(); save(); render(); toast(`Reverse diet started: ${target().kcal.toLocaleString()} kcal this week.`); },
  backToCut: () => { cfg().phase = 'cut'; cfg().reverseStart = null; save(); render(); },
  markDeload: () => { cfg().lastDeload = today(); save(); render(); toast('Deload started. Five easy days: no hard runs, half the sets, maintenance calories.'); },
  hist: el => { S.ui.hist = el.dataset.k; S.ui.open.history = true; render(); },
  editPr: el => { const p = S.prs.find(x => x.id === el.dataset.id); sheet(`<h2>${esc(p.name)}</h2><div class="grid g3">${field('Current best', `<input class="in" id="pr_cur" value="${fmtT(p.cur).replace(' s', '')}">`)}${field('Goal', `<input class="in" id="pr_goal" value="${fmtT(p.goal).replace(' s', '')}">`)}${field('All-time best', `<input class="in" id="pr_pb" value="${has(p.pb) ? fmtT(p.pb).replace(' s', '') : ''}">`)}</div><p class="tiny mut">Times as seconds (58.4) or minutes:seconds (17:45).</p><div class="row"><button class="btn pri" data-act="savePr" data-id="${p.id}">Save</button><button class="btn ghost" data-act="close">Cancel</button></div>`); },
  savePr: el => { const p = S.prs.find(x => x.id === el.dataset.id), cur = parseT($('#pr_cur').value), goal = parseT($('#pr_goal').value), pb = parseT($('#pr_pb').value); if (cur) { if (cur < p.cur) toast(cur <= p.goal ? 'Boss down. Goal beaten.' : `New best: ${fmtT(p.cur - cur)} faster.`); p.cur = cur; } if (goal) p.goal = goal; p.pb = pb && cur ? Math.min(pb, cur) : pb || p.pb; save(); closeModal(); render(); },
  addRun: () => { const km = num($('#r_km').value), sec = parseT($('#r_time').value); if (!km || !sec) return toast('Enter a distance and a time.'); S.runs.push({ id: uid(), date: $('#r_date').value || today(), km, sec, type: $('#r_type').value, name: $('#r_name').value.trim() }); S.runs.sort((a, b) => a.date.localeCompare(b.date)); save(); render(); toast(`Run saved: ${pace(sec, km)}.`); },
  addGym: () => { const sets = {}; $('#g_sets').value.split(',').forEach(s => { const m = s.trim().match(/^(.+?)\s+(\d+)$/); if (m) sets[m[1].toLowerCase()] = +m[2]; }); const focus = $('#g_focus').value.trim(); if (!focus && !Object.keys(sets).length) return toast('Enter a focus or sets, for example “back 14, biceps 6”.'); S.gym.push({ id: uid(), date: $('#g_date').value || today(), focus, sets, note: $('#g_note').value.trim() }); S.gym.sort((a, b) => a.date.localeCompare(b.date)); save(); render(); toast('Session saved.'); },
  addLift: () => { const lift = $('#l_lift').value.trim(), reps = num($('#l_reps').value), kg = num($('#l_kg').value); if (!lift || !reps) return toast('Enter the lift and the reps.'); S.lifts.push({ id: uid(), date: $('#l_date').value || today(), lift, kg, reps }); save(); S.ui.open.overload = true; render(); toast('Lift saved.'); },
  addForm: () => { const notes = $('#v_notes').value.trim(); if (!notes) return toast('Paste the coaching notes first.'); S.form.push({ id: uid(), date: $('#v_date').value || today(), kind: $('#v_kind').value, title: $('#v_title').value.trim() || 'Review', notes }); save(); S.ui.open.form = true; render(); },
  addBlood: () => { const v = num($('#b_val').value); if (v == null) return toast('Enter the value.'); S.bloods.push({ id: uid(), date: $('#b_date').value || today(), marker: $('#b_marker').value, value: v }); save(); render(); toast('Result saved. The age clock has been updated.'); },
  addBp: () => { const s = num($('#bp_sys').value), di = num($('#bp_dia').value); if (!s || !di) return toast('Enter both numbers.'); S.bp.push({ date: $('#bp_date').value || today(), sys: s, dia: di }); save(); render(); },
  del: el => { const [k, id] = el.dataset.k.split(':'), rm = (arr) => { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1); };
    ({ delRun: () => rm(S.runs), delGym: () => rm(S.gym), delLift: () => rm(S.lifts), delForm: () => rm(S.form), delBlood: () => rm(S.bloods), delFood: () => rm(S.food[today()] || []) })[k]?.(); save(); render(); },
  food: el => foodSheet(el.dataset.src === 'lib' ? LIB[+el.dataset.i] : OFF.res[+el.dataset.i]),
  addFood: () => { const g = num($('#fs_g').value); if (!g || g <= 0) return toast('Enter the grams.'); const f = CUR, fl = foodFlags(f); logFood(f, g, $('#fs_meal').value); save(); closeModal(); render(); toast(S.profile.coeliac && fl.gl ? 'Added, but this is flagged for gluten. Check the pack.' : `Added ${r0(g)} g ${f.name}.`); },
  offGo: () => { const q = $('#foodQ').value.trim(); if (q.length < 2) return toast('Type at least two letters.'); S.ui.q = q; S.ui.store = $('#foodStore').value; offSearch(q, S.ui.store); },
  fav: el => { const fv = S.favs[+el.dataset.i]; let miss = 0; fv.items.forEach(it => { const f = it.kcal != null ? it : LIB.find(x => x.name === it.name); if (!f) { miss++; return; } if (it.kcal != null) (S.food[today()] ||= []).push({ ...it, id: uid(), meal: fv.meal }); else logFood(f, it.g, fv.meal); }); save(); render(); toast(`${fv.name} logged${miss ? ` (${miss} item not found)` : ''}.`); },
  saveFav: el => { const ml = el.dataset.meal, es = (S.food[today()] || []).filter(x => x.meal === ml); S.favs.push({ name: `${ml} ${fmtD(today())}`, meal: ml, items: es.map(x => ({ ...x })) }); save(); render(); toast('Saved as a one-tap meal.'); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (fn) fn(el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').innerHTML) closeModal(); });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f) {
    const x = D(el.dataset.date), k = el.dataset.f, txt = ['bed', 'wake', 'note', 'sodium'].includes(k);
    const v = txt ? el.value : num(el.value.replace(/,/g, ''));
    if (v === '' || v == null) delete x[k]; else x[k] = v;
    if ((k === 'bed' || k === 'wake') && x.bed && x.wake && !has(x.sleep)) { const b = bedMin(x.bed), w = wakeMin(x.wake) + 360; if (w > b) x.sleep = r1((w - b) / 60); }
    save(); render();
  } else if (el.dataset.check) { const x = D(el.dataset.date); (x.checks ||= {})[el.dataset.check] = el.checked; save(); render(); }
  else if (el.dataset.reds) { S.reds[el.dataset.reds] = el.checked; save(); render(); }
  else if (el.id === 'impFile' && el.files[0]) { const r = new FileReader(); r.onload = () => importData(r.result); r.readAsText(el.files[0]); }
});
document.addEventListener('toggle', e => { const el = e.target; if (el.matches?.('details.drawer')) { S.ui.open[el.dataset.id] = el.open; save(); } }, true);
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'syncForm') {
    const p = parseSync($('#syncIn').value); if (!p.n) return toast('Nothing recognised. Format: SYNC: WT=150.2 | RHR=52 | SLEEP=8 | STEPS=10000 | CALS=2000');
    const d = p.date || today(); Object.assign(D(d), p.f);
    if (p.run) S.runs.push({ id: uid(), date: d, ...p.run }); if (p.lift) S.gym.push({ id: uid(), date: d, ...p.lift });
    save(); $('#syncIn').value = ''; render(); const rd = readiness(d); toast(`Synced ${p.n} fields for ${fmtD(d)}.${rd.band ? ' Readiness: ' + RX[rd.band].name + '.' : ''}`);
  } else if (e.target.id === 'foodForm') { S.ui.q = $('#foodQ').value.trim(); S.ui.store = $('#foodStore').value; OFF = { q: '', res: null, busy: false, err: '' }; render(); $('#foodQ')?.focus(); }
});
load(); render();
setInterval(() => { const c = $('#clkC'); if (c && S.profile.dob) c.textContent = ageYears().toFixed(7); }, 1000);
setInterval(() => { if (!$('#modal').innerHTML && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA' && document.activeElement?.tagName !== 'SELECT') render(); }, 300000);
</script>
