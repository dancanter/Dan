<!doctype html>
<html lang="en-GB">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d11">
<meta name="robots" content="noindex">
<title>Apex HUD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column of hairline panels on matte ink; a single sea-blue accent, gold only for rank, colour reserved for state. */
:root{
  color-scheme:dark;
  --bg:#0a0d11; --panel:#10141a; --panel2:#161b23; --line:#1e2530; --line2:#2b3442;
  --fg:#ece8df; --mut:#8d96a4; --dim:#5f6876;
  --acc:#7cc4d6; --gold:#cfab66; --violet:#a99de6;
  --ok:#62c690; --warn:#e3aa4f; --bad:#e8706f;
  --f-d:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-b);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-block:14px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .dim{color:var(--dim)} .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .acc{color:var(--acc)} .gold{color:var(--gold)}
.small{font-size:12px} .tiny{font-size:11px}

/* header */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{font:400 26px/1 var(--f-d);letter-spacing:.01em}
.brand i{color:var(--acc);font-style:italic}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mut);background:transparent;white-space:nowrap}
.chip b{color:var(--fg);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.g{background:var(--ok)} .dot.a{background:var(--warn)} .dot.r{background:var(--bad)}

.sync{display:flex;gap:8px;margin-bottom:12px}
.sync input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:12px var(--f-m)}
.sync input::placeholder{color:var(--dim)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 2px;color:var(--mut);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}

/* panels */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.sp{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel.flat{background:transparent}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:500}
.big{font:400 40px/1 var(--f-d)}
.mid{font:400 26px/1.05 var(--f-d)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:last-child{text-align:right}

.mission{border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px;background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;gap:14px;align-items:flex-start}
.mission h2{font:400 22px/1.2 var(--f-d);text-wrap:balance}
.mission p{color:var(--mut);margin-top:4px;max-width:65ch}
.state{border-left:3px solid var(--dim);padding:2px 0 2px 12px}
.state.g{border-color:var(--ok)} .state.a{border-color:var(--warn)} .state.r{border-color:var(--bad)}
.alert{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.alert.a{border-color:color-mix(in srgb,var(--warn) 55%,var(--line));background:color-mix(in srgb,var(--warn) 7%,transparent)}
.alert.r{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));background:color-mix(in srgb,var(--bad) 8%,transparent)}
.alert.g{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok) 6%,transparent)}
.alert .dot{margin-top:6px}

.tile{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.tile .v{font:500 18px/1.2 var(--f-m);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:11px;color:var(--mut);margin-top:2px}

.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#06222a}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{border-color:color-mix(in srgb,var(--bad) 60%,var(--line));color:var(--bad)}
.x{background:none;border:0;color:var(--dim);padding:2px 6px;font-size:14px}
.x:hover{color:var(--bad)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11px;color:var(--mut);letter-spacing:.04em}
.in{background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;width:100%;min-width:0;font-family:var(--f-m);font-size:13px}
textarea.in{font-family:var(--f-b);resize:vertical;min-height:72px}
select.in{font-family:var(--f-b)}

details.drawer{border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
details.drawer>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:500}
details.drawer>summary::-webkit-details-marker{display:none}
details.drawer>summary::after{content:"+";margin-left:auto;color:var(--mut);font:400 18px var(--f-m)}
details.drawer[open]>summary::after{content:"–"}
details.drawer>summary .hint{color:var(--mut);font-weight:400;font-size:12px}
details.drawer>.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}

.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{appearance:none;width:18px;height:18px;border:1.5px solid var(--line2);border-radius:6px;flex:none;margin:1px 0 0;display:grid;place-items:center;background:var(--bg)}
.check input:checked{background:var(--acc);border-color:var(--acc)}
.check input:checked::after{content:"";width:9px;height:5px;border:2px solid #06222a;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.check .t{font-size:13px}
.check .d{font-size:12px;color:var(--mut)}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--acc);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar.thick{height:12px}
.bar .tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold)}
.boss{padding:12px 0;border-bottom:1px solid var(--line)}
.boss:last-child{border-bottom:0}
.boss .bar>i{background:linear-gradient(90deg,var(--bad),var(--warn) 55%,var(--ok))}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-weight:500;color:var(--mut);text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.tall{max-height:380px;overflow:auto}

svg text{font-family:var(--f-m);font-size:10px;fill:var(--mut)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:2px;margin-right:5px;vertical-align:middle;background:var(--acc)}

.pill{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.pill.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.pill.a{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.pill.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.pill.b{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.pill.au{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}

.clock{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.clock .big{font-size:clamp(34px,8vw,56px)}
.clock .vs{color:var(--dim);font:italic 18px var(--f-d);padding-bottom:8px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.trophy{border:1px solid var(--line);border-radius:10px;padding:10px;opacity:.45}
.trophy.on{opacity:1;border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.trophy b{display:block;font-weight:500;font-size:13px}
.trophy.on b{color:var(--gold)}
.res{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.res:hover{background:var(--panel2)}
.res .nm{flex:1;min-width:0}
.res .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:500 12px var(--f-m);border:2px solid var(--line2);flex:none}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,6,9,.78);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:18px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.sheet h2{font:400 24px/1.15 var(--f-d)}
.tcount{font:400 clamp(54px,16vw,84px)/1 var(--f-m);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.02em}
.orb{width:150px;height:150px;border-radius:50%;margin:6px auto;border:1px solid var(--acc);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--acc) 28%,transparent),transparent 70%);transform:scale(.6);transition:transform 2s ease-in-out}
.cue{text-align:center;font:400 22px/1.3 var(--f-d);min-height:58px;text-wrap:balance}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;font-size:13px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}.bar>i,.orb{transition:none}}
.prose{max-width:68ch;color:var(--fg)} .prose p{margin:0 0 8px;color:var(--mut)} .prose b{color:var(--fg);font-weight:500}
.prose h3{font:400 19px/1.25 var(--f-d);margin:12px 0 6px}
.prose ul{margin:0 0 8px;padding-left:18px;color:var(--mut)} .prose li{margin-bottom:5px}
.tip{position:fixed;z-index:80;background:var(--fg);color:#0a0d11;font:500 12px var(--f-m);padding:6px 9px;border-radius:8px;pointer-events:none;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--gold);color:#1c1405;border:0;border-radius:999px;padding:13px 20px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.bub{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;white-space:pre-wrap;line-height:1.55}
.bub.user{align-self:flex-end;background:var(--panel2);max-width:85%}
.bub.assistant{border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.qbox{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex:none;margin-top:1px}
.qbox.on{background:var(--gold);border-color:var(--gold)}
.hgrid{display:flex;flex-direction:column;gap:7px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto 86px;gap:10px;align-items:center;font-size:12px}
.hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc{display:flex;gap:3px}.hc i{width:11px;height:11px;border-radius:3px;background:var(--line);cursor:pointer}.hc i.on{background:var(--acc)}
.hrow .num{text-align:right}
@media(max-width:520px){.hc i{width:8px;height:8px}.hrow{grid-template-columns:minmax(0,1fr) auto 64px}}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:6px}.heat span{height:34px;border-radius:7px;display:grid;place-items:center;cursor:pointer}.heat b{font:500 11px var(--f-m);color:#0a0d11;opacity:.75}
.sb{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;margin-top:10px}
.sb-main{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sb-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sb-tile{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.sb-tile:hover{border-color:var(--line2)}
.sb-v{font-size:22px;line-height:1}
@media(max-width:760px){.sb{grid-template-columns:1fr;justify-items:center}.sb-grid{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}}
.sl-t{font:400 34px/1 var(--f-d);min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
.chip-t{background:transparent;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;font:500 12px var(--f-m);color:var(--mut)}
.chip-t.on{background:var(--acc);border-color:var(--acc);color:#06222a}
.sl-in{width:130px;font-size:16px}
.sl-out{font:400 26px/1 var(--f-d);padding:0 6px 8px;min-width:90px}
.sl-sum{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
[hidden]{display:none!important}
.veil{position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center}.veil-in{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px 18px;font-size:13px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Apex <i>HUD</i></div>
    <span class="chip" id="chipPhase"></span>
    <span class="sp"></span>
    <span class="chip" id="chipCloud"></span>
    <span class="chip" id="chipRank"></span>
    <button class="btn sm ghost" data-act="openSettings">Settings &amp; data</button>
  </header>
  <form class="sync" id="syncForm" autocomplete="off">
    <input id="syncIn" aria-label="Smart paste sync line" placeholder="SYNC: WT=150.2 | RHR=52 | SLEEP=8 | STEPS=10000 | CALS=2000 | STUDY=3 | STRESS=3 | SODIUM=low">
    <button class="btn pri" type="submit">Sync</button>
  </form>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="loadVeil" class="veil" hidden><div class="veil-in">Loading your data from your account…</div></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

      <div class="bar thick" style="margin:8px 0 6px;overflow:visible"><i style="width:${w}%"></i>${pbw != null ? `<span class="tick" style="left:${pbw}%" title="All-time best"></span>` : ''}</div>

  };

  // weight chart: 60 days

  if (f === 'all' || f === 'gym') S.gym.forEach(g => rows.push([g.date, 'Gym', esc(g.focus || ''), Object.entries(g.sets || {}).map(([k, n]) => `${esc(k)} ${n}`).join(' · ') + (g.note ? ` · ${esc(g.note)}` : ''), `delGym:${g.id}`]));
  if (f === 'all' || f === 'lifts') S.lifts.forEach(l => rows.push([l.date, 'Lift', esc(l.lift), `${l.kg ? l.kg + ' kg × ' : ''}${l.reps}${l.kg ? ` · e1RM ${r1(e1rm(l.kg, l.reps))} kg` : ' reps'}`, `delLift:${l.id}`]));
  if (f === 'all' || f === 'days') Object.entries(S.days).forEach(([dt, x]) => { if (dayLogged(dt)) rows.push([dt, 'Day', [has(x.wt) ? x.wt + ' lb' : '', has(x.rhr) ? 'RHR ' + x.rhr : '', has(x.sleep) ? x.sleep + ' h sleep' : ''].filter(Boolean).join(' · '), [has(x.steps) ? x.steps.toLocaleString() + ' steps' : '', has(x.cals) ? x.cals + ' kcal' : '', has(x.study) ? x.study + ' h study' : '', x.refeed ? 'refeed' : '', esc(x.note || '')].filter(Boolean).join(' · '), '']); });

          <p class="small mut" style="margin-top:6px">${v ? `From your ${esc(v.from.name)} in ${fmtT(v.from.cur)}, using the Daniels–Gilbert race equations. A lab test can differ by about ±5%.` : 'Enter a current time between 1500 m and 10 km to estimate this.'}</p>
          <div class="grid g3" style="margin-top:12px">${tile('Runs this week', `${wrs[7].n}`, `max ${c.runsMax}`, wrs[7].n > c.runsMax ? 'warn' : '')}${tile('Hard runs', `${wrs[7].hard}`, 'ceiling 2', wrs[7].hard > 2 ? 'bad' : '')}${tile('Easy minutes', `${r0(wrs[7].easyMin)}`, 'Zone 2 this week')}</div></div>

    <div class="panel"><div class="row"><span class="eyebrow">Weight · water vs true trend</span><span class="sp"></span><span class="legend"><span><i style="background:var(--dim);height:6px;width:6px;border-radius:50%"></i>daily (water)</span><span><i></i>7-day average (true trend)</span></span></div>
      <div style="margin-top:10px">${lineChart({ days: wd, w: 1000, h: 250, label: 'Weight trend', unit: ' lb', series: [{ vals: wRaw, color: C.dim, line: false, dots: true, op: .8 }, { vals: wAvg, color: C.acc, w: 2.4, area: true, end: true }], hlines: c.floor ? [{ y: c.floor, color: C.bad, label: `floor ${c.floor} lb` }] : [] })}</div>
      <div class="grid g4" style="margin-top:12px">
        ${tile('7-day average', a ? r1(a.v) + ' lb' : '–', a ? `BMI ${bmi(a.v).toFixed(1)}` : '')}

        ${tile('To floor', a && c.floor ? r1(a.v - c.floor) + ' lb' : '–', c.floor ? `floor ${c.floor}` : 'no floor set')}

        <div style="margin-top:10px">${lineChart({ days: hd, dp: 0, unit: ' bpm', label: 'Resting heart rate', series: [{ vals: hd.map(x => day(x).rhr ?? null), color: C.bad, dots: true, end: true }, { vals: hd.map(x => day(x).hrv ?? null), color: C.violet, dots: true }], hlines: rhrBase(d) ? [{ y: rhrBase(d) + 4, color: C.warn, label: 'baseline +4' }] : [] })}</div></div>
      <div class="panel"><div class="eyebrow">Weekly distance (km)</div><div style="margin-top:10px">${barChart({ items: weeks.map((w, i) => ({ label: fmtD(w), v: wrs[i].km, color: wrs[i].hard > 2 ? C.warn : C.acc, title: `Week of ${fmtD(w)}`, extra: `${wrs[i].n} runs, ${wrs[i].hard} hard` })), fmt: r0, unit: ' km' })}</div><p class="tiny mut">Amber bars are weeks with three or more hard runs.</p></div>
    </div>
    <div class="grid g2">
      <div class="panel"><div class="row"><span class="eyebrow">Pace trend (sec per km, lower is faster)</span><span class="sp"></span><span class="legend"><span><i style="background:var(--ok)"></i>easy</span><span><i style="background:var(--warn)"></i>quality</span></span></div>
        <div style="margin-top:10px">${(() => { const all = [...easy, ...qual].sort((p, q) => p.date.localeCompare(q.date)); if (all.length < 2) return '<p class="mut small">Log runs to see this.</p>'; const ds = lastN(dDiff(d, all[0].date) + 1, d); const m = t => ds.map(x => { const r = t.find(q => q.date === x); return r ? r.sec / r.km : null; }); return lineChart({ days: ds, dp: 0, unit: ' s/km', label: 'Pace trend', series: [{ vals: m(easy), color: C.ok, dots: true }, { vals: m(qual), color: C.warn, dots: true }] }); })()}</div></div>

      ${Object.keys({ ...ST, ...wgs.sets }).map(k => { const n = wgs.sets[k] || 0, t = ST[k], st = !t ? ['', ''] : n > t[1] * 1.3 ? ['r', 'well over'] : n > t[1] ? ['a', 'over'] : n >= t[0] ? ['g', 'in range'] : ['', `${t[0] - n} to go`]; return `<tr><td>${esc(k)}</td><td class="n">${n}</td><td class="n mut">${t ? t[0] + '–' + t[1] : '–'}</td><td><div class="bar"><i style="width:${t ? clamp(n / t[1] * 100, 0, 100) : 50}%;background:${st[0] === 'r' ? C.bad : st[0] === 'a' ? C.warn : C.acc}"></i></div></td><td><span class="pill ${st[0]}">${st[1] || '–'}</span></td></tr>`; }).join('') || '<tr><td colspan="5" class="mut">No sessions this week yet.</td></tr>'}</table></div>

/* ============ LONGEVITY ============ */
function vLongevity() {
  const d = today(), c = cfg(), x = day(d), sl = stressLoad(d), pk = peakState(d), reds = Object.values(S.reds || {}).filter(Boolean).length;
  const peakCard = (() => {
    const m = (c.milestones || []).find(q => q.peak); if (!m) return '';
    const to = dDiff(m.date, d), st = pk ? pk.mode : to > 3 ? 'wait' : 'done';
    const pre = [['p_na', 'Salt the same as every other day, at the low end of your range', 'Do not cut it. A sudden drop raises aldosterone and you rebound puffier on day one of the trip.'], ['p_k', 'Potassium foods at every meal (4,000 mg from food)', 'Potatoes, kiwi, banana, coconut water, yoghurt, fish.'], ['p_carb', 'Carbs up by 50-80 g from rice, potatoes, oats, fruit', 'Fills muscle glycogen so muscles look full, not flat.'], ['p_new', 'No new foods, no cruciferous veg, no pulses, no sweeteners in bulk', 'Nothing your gut has not seen this month.'], ['p_water', 'Water as normal', 'Never restrict it.'], ['p_sleep', 'Two nights of 8.5 h+', 'The cheapest de-bloat there is.'], ['p_train', 'Last hard session 3 days out, last legs 4 days out', 'Muscle damage holds water for 48-72 h.']];
    const trip = [['t_prot', 'Protein at every meal: fish, steak, eggs, yoghurt', ''], ...(m.tips || []).map((t, i) => ['t_x' + i, t[0], t[1] || '']), ['t_walk', 'Walk everywhere: 10-14k steps happens by itself', ''], ['t_est', 'Estimate, do not log: palm of protein, fist of carbs, thumb of fat', 'Three days at maintenance changes nothing.'], ['t_wine', 'Water with every coffee; alcohol stays at zero', ''], ['t_scale', 'No scale until three mornings after you are home', 'Travel, restaurant salt and a flight add 2-4 lb of water. It is not fat and it leaves on its own.']];
    return `<div class="panel"><div class="row"><span class="eyebrow">${esc(m.name)} peak and de-bloat protocol</span><span class="sp"></span><span class="pill ${st === 'pre' || st === 'trip' ? 'b' : ''}">${st === 'wait' ? `starts in ${to - 3} days` : st === 'pre' ? `day ${pk.n} of 3` : st === 'trip' ? `travel day ${pk.n}` : st === 'post' ? 'back home' : 'complete'}</span></div>
      ${st === 'post' ? '<p class="small mut" style="margin-top:8px">Straight back to the normal plan today. No compensation: no extra deficit, no extra steps, no skipped meals. Weigh in from the third morning.</p>' : `<div class="grid g2" style="margin-top:8px"><div><div class="tiny mut">72 hours before</div>${checklist(d, pre)}</div><div><div class="tiny mut">Travel mode</div>${checklist(d, trip)}</div></div>`}</div>`;
  })();
  return `<div class="stack fade">
    ${longevityCard()}
    ${cellularCard()}
    ${cortisolCard()}
    ${puffCard()}
    ${peakCard}
    <div class="grid g2">
      <div class="panel"><div class="row"><span class="eyebrow">Inside: cellular habits</span><span class="sp"></span><span class="num small mut">${checksDone(d, CELL_HABITS)}/${CELL_HABITS.length}</span></div><div style="margin-top:6px">${checklist(d, CELL_HABITS)}</div></div>
      <div class="panel"><div class="row"><span class="eyebrow">Outside: skin and posture</span><span class="sp"></span><span class="num small mut">${checksDone(d, LOOK_HABITS)}/${LOOK_HABITS.length}</span></div><div style="margin-top:6px">${checklist(d, LOOK_HABITS)}</div></div>
    </div>
    <div class="grid g2">
      <div class="panel"><div class="row"><span class="eyebrow">Face and physique de-bloat</span><span class="sp"></span><span class="num small mut">${checksDone(d, BLOAT_HABITS)}/${BLOAT_HABITS.length}</span></div><div style="margin-top:6px">${checklist(d, BLOAT_HABITS)}</div>

function parseSync(str) {
  const parts = str.replace(/^\s*SYNC\s*:?/i, '').split('|').map(s => s.trim()).filter(Boolean), out = { f: {}, n: 0 };
  const ORDER = ['WT', 'RHR', 'HRV', 'SLEEP', 'DEEP', 'REM', 'STEPS', 'CALS', 'STUDY', 'CELLULAR', 'STRESS', 'SODIUM'];
  const MAP = { WT: 'wt', WEIGHT: 'wt', RHR: 'rhr', HRV: 'hrv', SLEEP: 'sleep', DEEP: 'deep', REM: 'rem', STEPS: 'steps', CALS: 'cals', KCAL: 'cals', CALORIES: 'cals', STUDY: 'study', CELLULAR: 'cellular', STRESS: 'stress', SORE: 'sore', SORENESS: 'sore', URGE: 'urge', LIGHT: 'light', MOOD: 'mood', PUFF: 'puff' };
  const keyed = parts.some(p => /^[A-Za-z_ ]+\s*[=:]/.test(p) && !/^\d{1,2}:\d{2}/.test(p));
  let pos = 0;
  parts.forEach(p => {
    let k, v; const m = p.match(/^([A-Za-z_ ]+?)\s*[=:]\s*(.*)$/);
    if (keyed) { if (!m) return; k = m[1].toUpperCase().trim(); v = m[2].trim(); }
    else { if (/^\d{4}-\d{2}-\d{2}$/.test(p)) { k = 'DATE'; v = p; } else { k = ORDER[pos++]; v = p; } }
    v = v.replace(/^\[|\]$/g, '').trim(); if (!v || /^(—|–|-|n\/?a|none|null)$/i.test(v)) return;
    if (k === 'DATE') { if (/^\d{4}-\d{2}-\d{2}$/.test(v)) out.date = v; return; }
    if (k === 'SODIUM') { const s = v.toLowerCase(); out.f.sodium = /^l/.test(s) ? 'low' : /^m/.test(s) ? 'med' : /^h/.test(s) ? 'high' : (num(s) != null ? (num(s) <= 1700 ? 'low' : num(s) <= 2200 ? 'med' : 'high') : undefined); if (out.f.sodium) out.n++; return; }
    if (k === 'BED' || k === 'WAKE') { if (/^\d{1,2}:\d{2}$/.test(v)) { out.f[k.toLowerCase()] = v.padStart(5, '0'); out.n++; } return; }
    if (k === 'RUN') { const km = v.match(/([\d.]+)\s*k/i), tm = v.match(/(\d+:\d{2}(?::\d{2})?)/), ty = v.match(/\b(easy|hard|speed|sub|tt|steady)\b/i); if (km && tm) { out.run = { km: +km[1], sec: parseT(tm[1]), type: ty ? ty[1].toLowerCase() : 'easy', name: v }; out.n++; } return; }
    if (k === 'LIFT' || k === 'GYM') { const n = v.match(/(\d+)\s*(sets)?\s*$/i), fo = v.replace(/(\d+)\s*(sets)?\s*$/i, '').trim() || 'gym'; out.lift = { focus: fo, sets: { [fo.toLowerCase()]: n ? +n[1] : 0 } }; out.n++; return; }
    const key = MAP[k]; if (!key) return; const n = num(v.replace(/,/g, '').replace(/[^\d.\-]/g, '')); if (n == null) return;
    out.f[key] = n; out.n++;
  });
  return out;
}

/* ============ recovery clock (idea from the Glow app): when each system is ready for hard work ============

  if (base && has(x.rhr) && x.rhr - base >= 5) { extra += 24; why.push(`resting HR +${r0(x.rhr - base)} +24 h`); }

/* ============ progress check (idea from the training system): are the sessions getting faster? ============
   Each rep session becomes a 1 km equivalent (Riegel, exponent 1.06) so 200s, 300s and 1 km reps compare. */

}
function progressCheck(d = today()) {

  const grp = (rs, sp) => rs.filter(r => sp ? r.type === 'speed' : r.type === 'hard').map(r => ({ r, ...kmEquiv(r) })).filter(x => sp ? x.rep <= 400 : x.rep >= 500);
  return [['Speed (200–400 m reps)', true], ['Long reps (500 m and up)', false]].map(([label, sp]) => {
    const now = grp(win(35, 0), sp), was = grp(win(70, 35), sp), a = now.length ? mean(now.map(x => x.s)) : null, b = was.length ? mean(was.map(x => x.s)) : null, pct = a && b ? (b - a) / b * 100 : null;

    else if (pct != null) { const hal = now.some(x => gymOn(dAdd(x.r.date, -1)).some(isLegs)), stacked = now.some(x => lastN(7, x.r.date).filter(q => runsOn(q).some(isHard)).length >= 3);
      call = pct >= 2 ? ['g', 'More of the same', 'Faster at the same spacing. Keep the session and the rest days around it exactly as they are.'] : pct > -2 ? ['b', 'Hold', 'Level. Repeat it; add one rep only when the last rep feels controlled.'] : hal || stacked ? ['a', 'Less', `Slower, and ${hal ? 'at least one was run the day after legs' : 'some weeks had three hard runs'}. Fix the spacing before adding anything: fresh legs, carbs before and after.`] : ['r', 'Rest first', 'Slower without an obvious cause. Take an easy week, then retest.']; }

/* ============ tomorrow's face forecast (idea from the Glow app) ============ */
function puffForecast(d = today()) {

    if (t.k > 0 && t.na / t.k > 1.2) { score -= 15; tips.push(`Sodium to potassium is ${(t.na / t.k).toFixed(1)} to 1. Aim for potassium higher: potatoes, avocado, yoghurt, kiwi, banana.`); }

/* ============ saving to the account (db capability) ============
   Browser storage inside the Claude app can come back empty after a reload, and every republish reloads
   the page. So the record of truth lives in the viewer's private area of the artifact database:
     data/users/<id>/core          everything except daily records and the per-device UI state
     data/users/<id>/d-YYYY-MM-DD  one document per day: the day's log and its food

const EMPTY_DAY = JSON.stringify({ day: null, food: [] });
function setCloud(st) {
  CL.state = st; const el = $('#chipCloud'); if (!el) return;
  const m = { local: ['', 'This device only'], loading: ['a', 'Loading your data…'], saving: ['a', 'Saving…'], saved: ['g', 'Saved to your account'], error: ['r', 'Not saved to account: retrying'], full: ['r', 'Account storage full'] }[st] || ['', st];
  el.innerHTML = `<span class="dot ${m[0]}"></span>${m[1]}`; el.title = st === 'local' ? 'This copy cannot reach your Claude account, so data stays in this browser. Copy a backup in Settings now and then.' : '';

const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r({ code: 'timeout' }), ms))]);
